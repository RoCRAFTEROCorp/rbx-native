[package]
name = "rbx_binary"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rbx_dom = { path = "../rbx_dom" }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode"] }
ruzstd = "0.9"
thiserror = "2"
# The bundled API dump, parsed once per process: the Service tag, so INST's
# IsService flag matches real Studio classes (Workspace, Lighting, ...), and
# which properties are legacy ContentIds, saved as String columns.
rbx_reflection = { path = "../rbx_reflection", features = ["embedded-dump"] }
# SSTR entries are keyed by MD5 like Roblox's own writer; already resolved in
# Cargo.lock (pulled in transitively via `oo7`), so this adds no new version.
md-5 = "0.10"
